<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Charcoal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0C" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>

    <!-- Brand Aura Pink & Purple Gradient -->
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF529A" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>

    <!-- Sparkle Primary Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7EB3" />
      <stop offset="100%" stop-color="#FF529A" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Aura Glow Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#auraGrad)" stroke-width="14" filter="url(#glow)" />

  <!-- Main AI Sparkle (4-point star) -->
  <path 
    d="M240 100 C240 180, 180 240, 100 240 C180 240, 240 300, 240 380 C240 300, 300 240, 380 240 C300 240, 240 180, 240 100 Z" 
    fill="url(#sparkleGrad)" 
    filter="url(#glow)"
  />

  <!-- Inner Sparkle Highlight Core -->
  <path 
    d="M240 140 C240 200, 200 240, 140 240 C200 240, 240 280, 240 340 C240 280, 280 240, 340 240 C280 240, 240 200, 240 140 Z" 
    fill="#FFFFFF" 
    opacity="0.9"
  />

  <!-- Top Right Accent Micro-Sparkle -->
  <path 
    d="M370 120 C370 145, 345 170, 320 170 C345 170, 370 195, 370 220 C370 195, 395 170, 420 170 C395 170, 370 145, 370 120 Z" 
    fill="#FF529A" 
  />
  <path 
    d="M370 135 C370 155, 355 170, 335 170 C355 170, 370 185, 370 205 C370 185, 385 170, 405 170 C385 170, 370 155, 370 135 Z" 
    fill="#FFFFFF" 
  />
</svg>
